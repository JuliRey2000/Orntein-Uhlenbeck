[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlab"
version = "0.1.0"
description = "Laboratorio de Reversión a la Media: herramienta educativa de pairs trading (cointegración + Ornstein–Uhlenbeck)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyarrow>=15",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: pruebas lentas (Monte Carlo con muchas semillas)",
    "network: requieren internet (se omiten por defecto en CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declara dependencias y parámetros con llamadas en los valores por defecto.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Header",
]
